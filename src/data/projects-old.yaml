  image: clip-italian.png
  description: |-
    CLIP is a multimodel model that can learn to represent images and text jointly in the same space. In this project, we aim to propose the first CLIP model trained on Italian data, that in this context can be considered a low resource language. Using a few techniques, we have been able to fine-tune a SOTA Italian CLIP model with only 1.4 million training samples.

    For more information, refer to our [demo](https://huggingface.co/spaces/clip-italian/clip-italian-demo).
- id: covid-browser
  title: Covid-19 Semantic Browser
  category: past
  summary: A semantic browser for SARS-CoV-2 and COVID-19 powered by neural language models.
  date: 2020-04-11
  funding: null
  period: "2020"
  collaborators:
    - Area Science Park
    - Italian Association of Computational Linguistics
  tags:
    - Natural Language Processing
    - Deep Learning
    - Information Extraction
    - Kaggle Competition
    - AREA Science Park
    - Italian Association for Computational Linguistics
  links:
    - label: Code
      url: https://github.com/gsarti/covid-papers-browser
      kind: code
  image: covid-browser.jpg
  description: |-
    In 2020, more than 3,000 scientific studies have been published on the SARS-CoV-2 virus and on the Covid-19 pathology. The total number of articles on the topic of coronaviruses exceeds 40,000 units. Such a volume of scientific production makes it impossible for doctors and researchers to keep up with the latest discoveries without the support of adequate digital platforms that are current-projectly nowhere in sight.

    To make up for this shortcoming, we propose an artificial intelligence system associated with a web application to perform natural language semantic querying inside the [COVID-19 Open Research Dataset](https://pages.semanticscholar.org/coronavirus-research) published by the American nonprofit [AllenAI](https://allenai.org/). The system leverages state-of-the-art neural language models trained on scientific publications in the biomedical domain for optimal retrieval performances. The adoption of the system aims to facilitate knowledge sharing across the scientific community and to accelerate the development of adequate drugs and vaccines to counter the ongoing pandemic.

    The project is led by Gabriele Sarti in collaboration with [Area Science Park](en.areasciencepark.it) and the [Italian Association of Computational Linguistics](ai-lc.it). The project used to be publicly available at covidbrowser.areasciencepark.it. You can now refer to the code implementation on [GitHub](https://github.com/gsarti/covid-papers-browser).
- id: aitalo-svevo
  title: "AItalo Svevo: Letters from an Artificial Intelligence"
  category: past
  summary: Generating letters with a neural language model in the style of Italo Svevo, a famous italian writer of the 20th century.
  date: 2019-09-27
  funding: null
  period: "2019"
  collaborators:
    - Cristina Fenu
  tags:
    - Natural Language Generation
    - Language Modeling
    - Italian NLP
    - Trieste Next
  links:
    - label: Corpus Analysis
      url: https://github.com/gsarti/svevo-letters-analysis
      kind: code
  image: aitalo-svevo.jpg
  description: We developed an interactive experience putting together NLP and literature to raise awareness on the latest developments in language modeling and natural language generation. Participants received a printed letter written by a neural language model (GPT-2) fine-tuned on the Italian epistolary corpus of Italo Svevo, an italian writer of the 20th century. Participants could choose among several topics discussed by the author in his letters, and were also given some context on author's life and literary production by Cristina Fenu, a digital humanist working at the [Svevian Museum of Trieste](http://www.museosveviano.it/ar/progetto/archivio-digitale/). An open-source implementation will soon be available on Github.
