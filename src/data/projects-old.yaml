- id: pecore
  title: Attributing Context Usage in Language Models
  category: current
  summary: An interpretability framework to detect and attribute context usage in language models' generations
  date: 2022-12-13
  funding: null
  period: 2022–present
  collaborators:
    - Grzegorz Chrupała
    - Malvina Nissim
    - Arianna Bisazza
    - Jirui Qi
    - Raquel Fernández
  tags:
    - Natural Language Processing
    - Interpretability
    - Deep Learning
    - Natural Language Generation
  publicationIds:
    - pecore
    - mirage
  links:
    - label: PECoRe Demo
      url: https://huggingface.co/spaces/gsarti/pecore
      kind: demo
    - label: MIRAGE Demo
      url: https://huggingface.co/spaces/gsarti/mirage
      kind: demo
    - label: PECoRe Repository
      url: https://github.com/gsarti/pecore
      kind: code
    - label: MIRAGE Repository
      url: https://github.com/Betswish/MIRAGE
      kind: code
    - label: Artifacts
      url: https://huggingface.co/collections/gsarti/pecore-iclr-2024-65edab42e28439e21b612c2e
      kind: other
  image: pecore.jpg
  description: |-
    PECoRe is a framework using the internal properties of generative language models to identify and attribute context usage in their generations. In particular, the framework is composed by two steps: Context-sensitive Token Identification (CTI), where generated tokens are classified as context-sensitive by contrastively comparing their probabilities with and without context, and Contextual Cues Imputation (CCI), where the dependence of token selected in the CTI step is highlighted by using contrastive attribution. The framework is integrated in the [Inseq interpretability library](https://github.com/inseq-team/inseq) and can be easily used thanks to the `inseq attribute-context` command.

    The framework is described in detail in *Quantifying the Plausibility of Context Reliance in Neural Machine Translation*, published at ICLR 2024. Its extension MIRAGE supports answer attribution in RAG applications and is presented in *Model Internals-based Answer Attribution for Trustworthy Retrieval-Augmented Generation*.
- id: inseq
  title: "Inseq: An Interpretability Toolkit for Sequence Generation Models"
  category: current
  summary: An open-source library to democratize access to model interpretability for sequence generation models
  date: 2022-12-13
  funding: null
  period: 2022–present
  collaborators:
    - Nils Feldhus
    - Ludwig Sickert
    - Oskar van der Wal
    - Malvina Nissim
    - Arianna Bisazza
  tags:
    - Natural Language Processing
