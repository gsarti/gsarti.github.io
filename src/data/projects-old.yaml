  publicationIds:
    - inseq
  links:
    - label: Docs
      url: https://inseq.readthedocs.io
      kind: other
    - label: Repository
      url: https://github.com/inseq-team/inseq
      kind: code
    - label: PyPI
      url: https://pypi.org/project/inseq/
