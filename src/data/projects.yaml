  image: context-attribution.png
  description: |-
    This project was the first and most consistent part of my PhD thesis. The main deliverables were [PECoRe](https://proceedings.iclr.cc/paper_files/paper/2024/hash/6d3040941a2d57ead4043556a70dd728-Abstract-Conference.html), a scalable framework to identify and attribute context usage in LLM generations through a combination of information-theoretic measures and contrastive gradient attribution, and the [Inseq](https://github.com/inseq-team/inseq) library to democratize access to attribution methods for generative language models. While originally tested on neural machine translation models, we validated the PECoRe framework's effectiveness on LLMs for question answering with retrieval-augmented generation ([MIRAGE](https://aclanthology.org/2024.emnlp-main.347/)), showing it can outperform self-citation approaches and lead to improved faithfulness to actual context usage. The framework is integrated in Inseq, supporting execution on all Hugging Face-compatible LLMs (`inseq attribute-context`).
- id: unsupervised-qe
  title: Unsupervised Machine Translation Quality Estimation
  category: past
  summary: Estimating translation quality from the internal confidence of translation models
  date: 2024-07
  funding:
  - nwo-indeep
  - imminent-language-technology
  period: "2025"
  collaborators:
    - Arianna Bisazza
    - Malvina Nissim
    - Grzegorz Chrupała
    - Vilém Zouhar
    - Ana Guerberof-Arenas
  tags:
    - Machine Translation
    - Quality Estimation
    - Uncertainty Estimation
    - Tools and Interfaces
  publicationIds:
    - qe4pe
    - qe-disagreement
  toolIds:
    - grote
    - labl
  datasetIds:
    - qe4pe
  image: unsupervised-qe.png
  description: |-
    This project, marking the end of my PhD journey, investigated whether word-level translation errors can be identified directly from a model's uncertainty and internal signals. The [QE4PE](https://doi.org/10.1162/TACL.a.46) study analyzed translations by 42 professional translators across two language directions, releasing their behavioral logs and fine-grained error annotations collected with our custom [GroTE](https://github.com/gsarti/grote) post-editing interface. The results showed that domain, language and individual baselines were more predictive of post-editing speed than differences between human-made and automatic error span highlights. We benchmarked 14 supervised and unsupervised metrics across 12 translation directions and multiple annotators, finding substantial potential in efficient uncertainty- and interpretability-based methods while showing that supervised systems and single-annotator evaluations can be brittle under label disagreement ([EMNLP 2025](https://aclanthology.org/2025.emnlp-main.924/)).
- id: italian-language-games
  title: "Culturally-grounded Reasoning for Italian Language Games"
  category: past
  summary: Language games as a testbed bridging logical reasoning and cultural understanding in LLMs
  date: 2024-06
  period: 2024 - 2026
  funding:
    - google-cloud-credits-2026
  collaborators:
    - Malvina Nissim
    - Felice Dell'Orletta
    - Cristiano Ciaccio
    - Alessio Miaschi
    - Asya Zanollo
    - Arianna Bisazza
  tags:
    - Italian NLP
    - Language Games
    - Sequential Reasoning
    - Cultural Understanding
    - Crossword Puzzles
    - Rebus Puzzles
  image: language-games-it.png
  description: |-
    This project used Italian rebuses and crosswords as culturally-grounded benchmark requiring sequential reasoning and sociolinguistic knowledge to evaluate LLM abilities in Italian. We introduced [EurekaRebus](https://aclanthology.org/2024.clicit-1.96/), a large collection of verbalized Italian rebuses, and showed that state-of-the-art LLMs struggle to solve them. The dataset later became part of the Italian [CALAMITA challenge](https://aclanthology.org/2024.clicit-1.132/). The project later expanded to crosswords: [Crossword Space](https://aclanthology.org/2025.clicit-1.26/) introduced dual encoders that learn a shared latent space between clues and answers, winning the CLiC-it 2025 Best Paper Award, while [Cruciverb-IT](https://apa.dipsco.unitn.it/evalita2026/62.pdf) was the first shared task on Italian crossword solving, releasing a large dataset of clue-answer pairs and generated grids for evaluating answer generation and end-to-end solving.
  publicationIds:
    - non-verbis
    - eureka-rebus-challenge
    - crossword-space
    - cruciverb-it
    - reading-between-clues
  datasetIds:
    - eureka-rebus
    - cruciverb-it
  modelIds:
    - verbis-solvers
    - crossword-space
- id: italian-nlp
  title: "Foundation Models for Italian NLP"
  category: past
  summary: Developing and evaluating Italian foundation models for text and vision
  date: 2021-08
  period: "2021-2022"
  funding:
    - title: "TPU Credits for JAX launch party"
      source: "Hugging Face and Google Cloud, 2021"
  collaborators:
    - Malvina Nissim
    - Giuseppe Attanasio
    - Silvia Terragni
    - Federico Bianchi
  tags:
    - Italian NLP
    - Foundation Models
  image: italian-nlp.png
  description: |-
    This project addressed the shortage of open foundation models and evaluation resources designed specifically for Italian across both text and vision. The main text deliverable was [IT5](https://aclanthology.org/2024.lrec-main.823/), the first family of Italian encoder-decoder Transformers: we cleaned a 41-billion-word Italian split of mC4, pretrained four model sizes, and introduced the ItaGen benchmark for Italian understanding and generation. IT5 achieved a stronger scale-to-performance ratio than multilingual alternatives and set a new state of the art for Italian language generation. In parallel, [CLIP-Italian](https://aclanthology.org/2023.clicit-1.11/) was trained on more than 1.4 million Italian image-text pairs and outperformed multilingual CLIP on image retrieval and zero-shot classification. We released the [IT5](https://huggingface.co/collections/gsarti/it5-lrec-coling-2024) and [CLIP-Italian](https://huggingface.co/gsarti/clip-italian) models alongside their training code, datasets and interactive demos.
  publicationIds:
    - it5
    - clip-italian
  datasetIds:
    - mc4-it
  modelIds:
    - it5
    - clip-italian
