  image: aletheias-quest.png
  description: |-
    I collaborated in the organization of [Aletheia's Quest](https://aletheias-quest.github.io/), a competition designed to move AI lie detection beyond methods tailored to a single model or behavior. In the first phase, pre-selected red teams produced diverse deception datasets and trained model organisms to lie in specific undisclosed scenarios. During the main competition, blue teams developed unified detectors for deception detection with either black-box access or privileged white-box access to weights and activations through [NNsight and NDIF](https://ndif.us/). Reproducible baselines and a public [validation leaderboard](https://huggingface.co/spaces/NDIF/aletheias-leaderboard) allowed participants to obtain live feedback for their submissions. At the end of the competition, final methods were evaluated on held-out red teams datasets using OOD AUROC as the main success metric. The competition adopted explicit safeguards against organism-specific shortcuts and additional recognition for scientific novelty and computational scalability.
- id: ndif-ecosystem
  title: "The NDIF Ecosystem: Open-source Tools and Infrastructure for Interpretability Research"
  category: past
  summary: A suite of tools for supporting interpretability research on deep neural networks
