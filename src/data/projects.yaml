  image: ndif-ecosystem.png
  description: |-
    During my postdoc with the [National Deep Inference Fabric (NDIF)](https://ndif.us) team, I contributed to the development of a suite of open-source tools and infrastructure to support large-scale interpretability research on LLMs. The NDIF ecosystem is based on [NNsight](https://nnsight.net), a library built on PyTorch to simplify internal inspection and interventions on deep learning models, with first-class support for LLMs and remote execution capabilities on the NDIF server. [NNterp](https://ndif-team.github.io/nnterp/) extends NNsight with standardized naming and efficient implementations of common methods in interpretability research, and the [NDIF Workbench](https://workbench.ndif.us) is a web-based interface for prototyping and exploration, supporting interpretability educators. I personally contributed to the initial version of [NDIF Skills](https://github.com/ndif-team/skills) to facilitate AI-assisted interpretability research, and to the development of the [Interpretability Interchange Format (INIF)](https://github.com/ndif-team/inif) to enhance the reproducibility and portability of interpretability artifacts.
  toolIds:
    - ndif-skills
    - inif

- id: context-attribution
  title: Attributing Context Usage in Language Models
  category: past
  summary: Tools and methods for scalable input attribution in language models
