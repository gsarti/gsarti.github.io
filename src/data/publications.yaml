- id: mirage
  featuredOrder: 6
  title: Model Internals-based Answer Attribution for Trustworthy Retrieval-Augmented Generation
  authors:
    - Jirui Qi
    - Gabriele Sarti
    - Raquel Fernández
    - Arianna Bisazza
  contributions:
    - authors:
        - Jirui Qi
        - Gabriele Sarti
      label: Equal contribution
  date: 2024-11-01
  type: conference
  venue: Conference on Empirical Methods for Natural Language Processing (EMNLP)
  venueShort: EMNLP 2024
  citation:
    containerTitle: Proceedings of the 2024 Conference on Empirical Methods in Natural Language Processing
    doi: 10.18653/v1/2024.emnlp-main.347
    pages: 6037-6053
    publisher: Association for Computational Linguistics
  abstract: We present MIRAGE — Model Internals-based RAG
    Explanations — a plug-and-play approach using model internals for faithful answer attribution in
    RAG applications. MIRAGE detects context-sensitive answer tokens and pairs them with retrieved
    documents contributing to their prediction via saliency methods. We evaluate our proposed
    approach on a multilingual extractive QA dataset, finding high agreement with human answer
    attribution. On open-ended QA, MIRAGE achieves citation quality and efficiency comparable to
    self-citation while also allowing for a finer-grained control of attribution parameters. Our
    qualitative evaluation highlights the faithfulness of MIRAGE's attributions and underscores the
    promising application of model internals for RAG answer attribution.
  links:
    - label: Paper
      url: https://aclanthology.org/2024.emnlp-main.347/
      kind: pdf
