  authorDisplay:
    web:
      head: 4
      tail: 8
    cv:
      head: 4
      tail: 1
  date: 2026-02-23
  type: preprint
  venue: CoRR/2602.20021
  venueShort: Tech Report
  abstract: Agents of Chaos is an exploratory red-teaming study of autonomous language-model-powered agents
    deployed in a live lab environment with persistent memory, email accounts, messaging applications
    access, file systems, and shell execution. Over a two-week period, twenty AI researchers
    interacted with the agents under benign and adversarial conditions. Focusing on failures
    emerging from the integration of language models with autonomy, tool use, and multi-party
    communication, we document eleven representative case studies. Observed behaviors include
    unauthorized compliance with non-owners, disclosure of sensitive information, execution of
    destructive system-level actions, denial-of-service conditions, uncontrolled resource
    consumption, identity spoofing vulnerabilities, cross-agent propagation of unsafe practices, and
    partial system takeover. Our findings establish the existence of security-, privacy-, and
    governance-relevant vulnerabilities in realistic deployment settings.
