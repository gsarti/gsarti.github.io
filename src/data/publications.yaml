- id: goal-directedness
  featuredOrder: 4
  title: A Behavioural and Representational Evaluation of Goal-Directedness in Language Model Agents
  authors:
    - Raghu Arghal
    - Fade Chen
    - Niall Dalton
    - Evgenii Kortukov
    - Calum McNamara
    - Angelos Nalmpantis
    - Moksh Nirvaan
    - Gabriele Sarti
    - Mario Giulianelli
  contributions:
    - authors:
        - Raghu Arghal
        - Fade Chen
        - Niall Dalton
        - Evgenii Kortukov
        - Calum McNamara
        - Angelos Nalmpantis
        - Moksh Nirvaan
      label: Alphabetical order
  date: 2026-02-09
  type: conference
  venue: International Conference on Machine Learning (ICML)
  venueShort: ICML 2026
  citation:
    containerTitle: Proceedings of the 43rd International Conference on Machine Learning
  abstract: We propose a framework for evaluating goal-directedness that integrates behavioural evaluation with
    interpretability-based analyses of models' internal representations. As a case study, we examine
    an LLM agent navigating a 2D grid world toward a goal state. Behaviourally, we evaluate the
    agent against an optimal policy across varying grid sizes, obstacle densities, and goal
    structures, finding that performance scales with task difficulty while remaining robust to
    difficulty-preserving transformations and complex goal structures. We then use probing methods
    to decode the agent's internal representations of the environment state and its multi-step
    action plans. We find that the LLM agent non-linearly encodes a coarse spatial map of the
    environment, preserving approximate task-relevant cues about its position and the goal location;
    that its actions are broadly consistent with these internal representations; and that reasoning
    reorganises them, shifting from broader environment structural cues toward information
    supporting immediate action selection.
  links:
    - label: Paper
      url: https://openreview.net/forum?id=OqYz3v9111
      kind: pdf
