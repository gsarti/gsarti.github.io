- id: commitment-boundary
  featuredOrder: 1
  title: "Beyond the Commitment Boundary: Probing Epiphenomenal Chain-of-Thought in Large Reasoning
    Models"
  authors:
    - Daniel Scalena
    - Sara Candussio
    - Luca Bortolussi
    - Elisabetta Fersini
    - Malvina Nissim
    - Gabriele Sarti
  contributions:
    - authors:
        - Daniel Scalena
        - Sara Candussio
      label: Equal contribution
  date: 2026-06-11
  type: preprint
  venue: CoRR/2606.13603
  venueShort: Under Review
  abstract: We estimate CoT steps causal importance via early exit and use this measure to
    study how answers form across the reasoning traces of several model families. Across diverse
    tasks, we find that reasoning typically crosses a commitment boundary—a sharp transition from
    transient intermediate guesses to a stable, high-confidence answer. This transition often
    happens in a single step, well before the model's reasoning block ends, and is followed by
    epiphenomenal CoT steps that leave the final answer probability unaltered. Using attention
    probes, we show that answer-formation stages can be linearly decoded from intermediate reasoning
    steps with high accuracy and generalize robustly to unseen reasoning tasks. We exploit this
    signal to early-exit reasoning blocks at the commitment boundary, reducing the length of CoTs up
    to 55% on average with negligible impact on model performance.
  links:
    - label: Paper
      url: https://arxiv.org/abs/2606.13603
      kind: pdf
    - label: Code
      url: https://github.com/DanielSc4/Commitment-Boundary
      kind: code
- id: future-probes
  featuredOrder: 2
  title: Predicting Future Behaviors in Reasoning Models Enables Better Steering
  authors:
    - Evgenii Kortukov
    - Piotr Komorowski
    - Florian Klein
    - Paula Engl
    - Gabriele Sarti
    - Seong Joon Oh
    - Sebastian Lapuschkin
    - Wojciech Samek
  date: 2026-06-09
  type: preprint
  venue: CoRR/2606.11172
  venueShort: Under Review
  abstract: Prior steering work implicitly relies on internal features that detect
    behavior in already generated text, and these are poor predictors of future behavioral outcomes. Instead, we train
    activation probes to predict future behavior likelihoods from intermediate reasoning steps.
    These probes predict the most likely behavior with 64%–91% accuracy, revealing a separate type
    of internal prediction features. Building on these prediction features, we introduce a
    text-level steering method, Future Probe Controlled Generation. FPCG samples multiple candidate
    sentences and chooses the best one according to a probe predicting the future behavior
    likelihood. This enables steering with almost no output quality degradation. FPCG also enables
    steering in several evaluations where activation steering fails.
  links:
