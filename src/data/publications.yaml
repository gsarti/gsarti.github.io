- id: eureka-rebus-challenge
  title: "EurekaRebus - Verbalized Rebus Solving with LLMs: A CALAMITA Challenge"
  authors:
    - Gabriele Sarti
    - Tommaso Caselli
    - Arianna Bisazza
    - Malvina Nissim
  date: 2024-12-01
  type: workshop
  venue: Proceedings of the Tenth Italian Conference on Computational Linguistics (CLiC-it 2024)
  venueShort: CLiC-it 2024
  citation:
    containerTitle: Proceedings of the Tenth Italian Conference on Computational Linguistics (CLiC-it 2024)
    pages: 1202-1208
    publisher: CEUR Workshop Proceedings
  abstract: >-
    Language games can be valuable resources for testing the ability of large language models
    (LLMs) to conduct challenging multi-step, knowledge-intensive inferences while respecting
    predefined constraints. Our proposed challenge prompts LLMs to reason step-by-step to solve
    verbalized variants of rebus games recently introduced with the EurekaRebus dataset. Verbalized
    rebuses replace visual cues with crossword definitions to create an encrypted first pass, making
    the problem entirely text-based. We introduce a simplified task variant with word length hints
    and adopt a comprehensive set of metrics to obtain a granular overview of models' performance in
    knowledge recall, constraints adherence, and re-segmentation abilities across reasoning steps.
  links:
    - label: Paper
      url: https://aclanthology.org/2024.clicit-1.132/
      kind: pdf
