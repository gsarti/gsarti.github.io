- id: steering-litmt
  featuredOrder: 5
  title: Steering Large Language Models for Machine Translation Personalization
  authors:
    - Daniel Scalena
    - Gabriele Sarti
    - Arianna Bisazza
    - Elisabetta Fersini
    - Malvina Nissim
  contributions:
    - authors:
        - Daniel Scalena
        - Gabriele Sarti
      label: Equal contribution
  date: 2026-03-24
  type: conference
  venue: Conference of the European Chapter of the Association for Computational Linguistics (EACL)
  venueShort: EACL 2026
  citation:
    containerTitle: Proceedings of the 19th Conference of the European Chapter of the Association for
      Computational Linguistics (Volume 1)
    doi: 10.18653/v1/2026.eacl-long.217
    pages: 4681-4701
    publisher: Association for Computational Linguistics
  abstract: We explore various strategies for personalizing automatically generated translations when few examples are
    available, with a focus on the challenging domain of literary translation. After showing that classifiers can
    detect personalized translations with high accuracy, we evaluate various
    prompting strategies and inference-time interventions for steering model generations towards a
    personalized style, with a particular focus on contrastive steering with sparse autoencoder
    (SAE) latents to identify salient personalization properties. We demonstrate that contrastive
    SAE steering yields robust style conditioning and translation quality, resulting in higher
    inference-time computational efficiency than prompting approaches. We further examine the impact
    of steering on model activations, finding that layers encoding personalization properties are
    impacted similarly by prompting and SAE steering, suggesting a similar mechanism at play.
  links:
    - label: Paper
      url: https://aclanthology.org/2026.eacl-long.217/
      kind: pdf
    - label: Code
      url: https://github.com/DanielSc4/steering-for-personalization
      kind: code
