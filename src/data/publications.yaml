- id: transformer-primer
  featuredOrder: 8
  title: A Primer on the Inner Workings of Transformer-based Language Models
  authors:
    - Javier Ferrando
    - Gabriele Sarti
    - Arianna Bisazza
    - Marta R. Costa-jussà
  date: 2024-04-30
  type: preprint
  venue: CoRR/2405.00208
  venueShort: Survey
  abstract: The rapid progress of research aimed at interpreting the inner workings of advanced
    language models has highlighted a need for contextualizing the insights gained from years of
    work in this area. This primer provides a concise technical introduction to the current
    techniques used to interpret the inner workings of Transformer-based language models, focusing
    on the generative decoder-only architecture. We conclude by presenting a comprehensive overview
    of the known internal mechanisms implemented by these models, uncovering connections across
    popular approaches and active research directions in this area.
  links:
    - label: Paper
      url: https://arxiv.org/abs/2405.00208
      kind: pdf
- id: phd-thesis
  title: "From Insights to Impact: Actionable Interpretability for Neural Machine Translation"
  authors:
    - Gabriele Sarti
  date: 2025-12-11
  type: thesis
  venue: Ph.D. Thesis, University of Groningen
  venueShort: Ph.D. Thesis
  citation:
    school: University of Groningen
    thesisType: phd
  abstract: "This dissertation aims to bridge the gap between method-centric interpretability research
    and outcome-centric real-world machine translation applications. We develop novel methods to
    understand and control language model generation, then study how to integrate these advances
    effectively into human translation workflows. Our research spans three interconnected
    macro-themes: understanding how language models exploit contextual information during
    generation, controlling model generation for personalized translation outputs, and integrating
    interpretability insights into human translation workflows."
