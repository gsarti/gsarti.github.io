      url: https://huggingface.co/spaces/gsarti/mirage
      kind: demo
- id: pecore
  featuredOrder: 7
  title: Quantifying the Plausibility of Context Reliance in Neural Machine Translation
  authors:
    - Gabriele Sarti
    - Grzegorz Chrupała
    - Malvina Nissim
    - Arianna Bisazza
  date: 2024-01-16
  type: conference
  venue: International Conference on Learning Representations (ICLR)
  venueShort: ICLR 2024
  citation:
    containerTitle: International Conference on Learning Representations
    pages: 25526--25554
  abstract: We introduce Plausibility Evaluation of Context
    Reliance (PECoRe), an end-to-end interpretability framework designed to quantify context usage in language models'
    generations. Our approach leverages model internals to (i) contrastively identify context-sensitive target tokens
    in generated texts and (ii) link them to contextual cues justifying their prediction. We use PECoRe to quantify the
    plausibility of context-aware machine translation models, comparing model rationales with human annotations across
    several discourse-level phenomena. Finally, we apply our method to unannotated model translations to identify
    context-mediated predictions and highlight instances of (im)plausible context usage throughout generation.
  links:
    - label: Paper
      url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/6d3040941a2d57ead4043556a70dd728-Abstract-Conference.html
