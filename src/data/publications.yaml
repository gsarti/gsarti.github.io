- id: inseq
  featuredOrder: 9
  title: "Inseq: An Interpretability Toolkit for Sequence Generation Models"
  authors:
    - Gabriele Sarti
    - Nils Feldhus
    - Ludwig Sickert
    - Oskar van der Wal
    - Malvina Nissim
    - Arianna Bisazza
  date: 2023-07-01
  type: conference
  venue: "Annual Meeting of the Association for Computational Linguistics: System Demonstrations (ACL
    Demo)"
  venueShort: ACL 2023
  citation:
    containerTitle: "Proceedings of the 61st Annual Meeting of the Association for Computational
      Linguistics (Volume 3: System Demonstrations)"
    doi: 10.18653/v1/2023.acl-demo.40
    pages: 421-435
    publisher: Association for Computational Linguistics
  abstract: Inseq is a Python library to democratize access to
    interpretability analyses of sequence generation models. It enables intuitive and optimized
    extraction of models' internal information and feature importance scores for popular
    decoder-only and encoder-decoder Transformers architectures. We showcase its potential by
    adopting it to highlight gender biases in machine translation models and locate factual
    knowledge inside GPT-2. Thanks to its extensible interface supporting cutting-edge techniques
    such as contrastive feature attribution, Inseq can drive future advances in explainable natural
    language generation, centralizing good practices and enabling fair and reproducible model
    evaluations.
  links:
