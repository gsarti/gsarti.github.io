- id: mit-scaling-interp-2026
  cv:
    display: Algorithmic Alignment Group, MIT CSAIL. Boston, MA, USA. 2026
  title: Scaling Interpretability for LLM Agents
  event: Algorithmic Alignment Group Seminar
  location: MIT CSAIL, Cambridge, MA, USA
  mapPlace: boston
  date: 2026-05-12
  summary: Behavioral evaluations and interpretability offer complementary but disconnected views of large language models understanding. I begin by present a preliminary investigation combining behavioral evaluation with representational analysis to assess goal-directedness in LLM agents. Studying an LLM navigating grid worlds, we decode "cognitive maps" from model activations and show that many apparent behavioral failures are rational under the agent's imperfect internal beliefs. Finally, I outline an updated view of the NDIF ecosystem and highlight our vision for open-source infrastructure for democratizing white-box evaluations.
  links:
    - label: Slides
      url: https://docs.google.com/presentation/d/1fhHTZ_MLLwSKMZKOaWvH60IzNsBVP1OkHMSEa415WZQ/edit?usp=sharing
      kind: slides
- id: baulab-scaling-interp-2026
  cv:
    display: BauLab, Northeastern University. Boston, MA, USA. 2026.
  title: Scaling Interpretability for LLM Agents
  event: BauLab Group Seminar
  location: Northeastern University, Boston, MA, USA
  mapPlace: boston
  date: 2026-03-27
  summary: Evaluations and interpretability offer complementary but disconnected views of large language models understanding. This talk presents a research program aimed at bridging this gap across three threads. First, I describe PECoRe and MIRAGE frameworks for scalable context usage analyses in LLM generations, with applications to answer attribution in RAG settings. Second, I present a framework combining behavioral evaluation with representational analysis to assess goal-directedness in LLM agents. Studying an LLM navigating grid worlds, we decode cognitive maps from model activations and show that many apparent behavioral failures are rational under the agent's imperfect internal beliefs. Finally, I outline an updated view of the NDIF ecosystem and highlight our vision for open-source infrastructure for merging evals and interpretability workflows.
